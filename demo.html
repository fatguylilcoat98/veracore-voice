<!DOCTYPE html>
<!--
  THE GOOD NEIGHBOR GUARD — Veracore + Cora
  © 2026 Christopher Hughes | Sacramento CA
  Truth · Safety · We Got Your Back
-->
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>The Good Neighbor Guard — Veracore + Cora</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#06090f;
  --surface:#0c1018;
  --border:rgba(45,212,191,.06);
  --border2:rgba(45,212,191,.12);
  --text:#e2eaf4;
  --muted:#6b7d9e;
  --dim:#384560;
  --teal:#2dd4bf;
  --teal-glow:rgba(45,212,191,.08);
  --blue:#60a5fa;
  --green:#4ade80;
  --red:#ef4444;
  --amber:#f59e0b;
  --mono:'JetBrains Mono',monospace;
  --sans:'Inter',system-ui,sans-serif;
  --display:'Orbitron',sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:var(--bg);color:var(--text);height:100vh;overflow:hidden}

/* ══ HEADER — unified GNG branding ══ */
.header{
  display:flex;align-items:center;justify-content:space-between;
  padding:0 24px;height:54px;
  background:linear-gradient(180deg,rgba(12,16,24,.98),rgba(12,16,24,.95));
  border-bottom:1px solid var(--border2);
  flex-shrink:0;
}
.header-l{display:flex;align-items:center;gap:14px}
.gng-logo{
  width:34px;height:34px;border-radius:10px;
  background:linear-gradient(135deg,#0d3d3a,#1a5c56);
  border:1.5px solid rgba(45,212,191,.25);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--display);font-size:14px;font-weight:900;color:var(--teal);
  box-shadow:0 0 12px rgba(45,212,191,.1);
}
.header-brand{display:flex;flex-direction:column;gap:1px}
.header-org{
  font-family:var(--display);font-size:9px;font-weight:700;
  letter-spacing:.2em;text-transform:uppercase;color:var(--teal);opacity:.7;
}
.header-title{font-size:15px;font-weight:700;color:var(--text);letter-spacing:.01em}
.header-title .vc{color:var(--teal)}
.header-title .co{color:var(--teal);opacity:.7}
.header-title .sep{color:var(--dim);margin:0 2px}

.header-r{display:flex;align-items:center;gap:14px}
.hdr-dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 6px rgba(74,222,128,.3)}
.hdr-dot.off{background:var(--red);box-shadow:0 0 6px rgba(239,68,68,.3)}
.hdr-label{font-family:var(--mono);font-size:9px;color:var(--muted);letter-spacing:.08em}
.btn-reset{
  border:1px solid var(--border2);background:rgba(45,212,191,.04);
  color:var(--teal);border-radius:6px;padding:5px 14px;
  font-size:10px;font-weight:600;cursor:pointer;font-family:var(--sans);
  letter-spacing:.03em;transition:all .15s;opacity:.7;
}
.btn-reset:hover{opacity:1;background:rgba(45,212,191,.08)}

/* ══ DIVIDER LINE — runs across both panels ══ */
.divider-line{height:1px;background:linear-gradient(90deg,transparent,var(--border2) 20%,var(--border2) 80%,transparent);flex-shrink:0}

/* ══ SPLIT LAYOUT ══ */
.split{display:grid;grid-template-columns:3fr 2fr;height:calc(100vh - 55px)}

/* Left: Veracore */
.panel-vc{position:relative;overflow:hidden;background:var(--bg)}
.vc-frame{width:100%;height:100%;border:none;background:var(--bg)}

/* Right: Cora */
.panel-cora{
  display:flex;flex-direction:column;
  padding:20px 22px 16px;
  background:var(--surface);
  border-left:1px solid var(--border2);
  overflow:hidden;
}

/* ── Cora header ── */
.cora-header{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:14px;flex-shrink:0;
  padding-bottom:12px;border-bottom:1px solid var(--border);
}
.cora-name{
  font-family:var(--display);font-size:14px;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;color:var(--teal);
}
.cora-tag{
  font-family:var(--mono);font-size:8px;color:var(--dim);
  letter-spacing:.12em;text-transform:uppercase;
}

/* ── Voice button ── */
.cora-btn{
  width:100%;padding:15px;border-radius:10px;
  border:1.5px solid var(--border2);
  background:var(--teal-glow);
  color:var(--teal);font-size:14px;font-weight:700;
  cursor:pointer;transition:all .25s;
  margin-bottom:12px;flex-shrink:0;
  font-family:var(--sans);letter-spacing:.02em;
}
.cora-btn:hover{background:rgba(45,212,191,.12);border-color:rgba(45,212,191,.25)}
.cora-btn.listening{
  border-color:rgba(74,222,128,.3);background:rgba(74,222,128,.04);color:var(--green);
}
.cora-btn.speaking{
  border-color:rgba(45,212,191,.25);background:rgba(45,212,191,.06);color:var(--teal);
}
.cora-btn.processing{
  border-color:rgba(96,165,250,.2);background:rgba(96,165,250,.03);color:var(--blue);
}
.cora-btn:disabled{opacity:.35;cursor:not-allowed}

/* Voice select */
.vrow{display:flex;align-items:center;gap:6px;margin-bottom:10px;flex-shrink:0}
.vrow label{font-size:9px;color:var(--dim);font-family:var(--mono);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.vrow select{
  flex:1;padding:5px 8px;border-radius:6px;
  background:rgba(45,212,191,.03);border:1px solid var(--border);
  color:var(--text);font-size:10px;font-family:var(--sans);outline:none;
}
.vrow select:focus{border-color:var(--border2)}

/* ── Transcript ── */
.transcript{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding-right:3px}
.transcript::-webkit-scrollbar{width:3px}
.transcript::-webkit-scrollbar-thumb{background:rgba(45,212,191,.08);border-radius:2px}

.tr-empty{
  flex:1;display:flex;align-items:center;justify-content:center;
  text-align:center;color:var(--dim);font-size:12px;line-height:2;padding:0 12px;
}

.bub{padding:12px 14px;border-radius:10px;font-size:13px;line-height:1.7;animation:fadeIn .3s ease;max-width:95%}
.bub .who{font-family:var(--mono);font-size:8px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:4px;display:block}
.bub.user{background:rgba(45,212,191,.04);border:1px solid rgba(45,212,191,.08);align-self:flex-end}
.bub.user .who{color:var(--teal);opacity:.6}
.bub.cora{background:rgba(45,212,191,.03);border:1px solid rgba(45,212,191,.06)}
.bub.cora .who{color:var(--teal)}
.bub.wait{background:transparent;border:1px dashed rgba(45,212,191,.1);color:var(--muted);font-style:italic}

.cora-foot{
  flex-shrink:0;margin-top:8px;
  font-family:var(--mono);font-size:9px;color:var(--dim);text-align:center;
  padding-top:8px;border-top:1px solid var(--border);
}

@keyframes fadeIn{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:translateY(0)}}

@media(max-width:900px){
  .split{grid-template-columns:1fr}
  .panel-vc{height:50vh;border-right:none}
  .panel-cora{border-left:none;border-top:1px solid var(--border2)}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
const VC="https://veracore.onrender.com";
const VC_EMBED=VC+"?embed_key=bYVuUELDctjC7dRfbhEPkSrwsc0vpBqECdwRo1mB74Q";

const S={phase:"idle",question:"",interim:"",messages:[],error:null,online:true,selectedVoice:null};

// ── Voices — warm female priority ──
const VPRI=["Microsoft Aria","Microsoft Jenny","Microsoft Sonia","Samantha","Karen","Google US English","Google UK English Female"];
let voices=[],bestV=null;
function loadV(){
  voices=speechSynthesis.getVoices();if(!voices.length)return;
  for(const p of VPRI){const f=voices.find(v=>v.name.includes(p));if(f){bestV=f;break;}}
  if(!bestV)bestV=voices.find(v=>v.lang.startsWith("en")&&/female|woman|zira|samantha|karen|jenny|aria|sonia|libby|tessa|fiona|victoria|susan/i.test(v.name));
  if(!bestV)bestV=voices.find(v=>v.lang.startsWith("en"))||voices[0];
  render();
}
if(window.speechSynthesis){speechSynthesis.onvoiceschanged=loadV;loadV();}
function getV(){return S.selectedVoice!==null&&voices[S.selectedVoice]?voices[S.selectedVoice]:bestV;}

// ── Speech Recognition ──
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null;
if(SR){
  rec=new SR();rec.lang="en-US";rec.interimResults=true;rec.continuous=false;
  rec.onresult=(ev)=>{
    let interim="",final="";
    for(let i=ev.resultIndex;i<ev.results.length;i++){
      const t=ev.results[i][0].transcript;
      if(ev.results[i].isFinal)final+=t;else interim+=t;
    }
    if(final){S.question=final.trim();S.interim="";S.phase="processing";render();fire(S.question);}
    else{S.interim=interim;render();}
  };
  rec.onerror=(ev)=>{if(ev.error!=="no-speech")S.error="Mic error: "+ev.error;S.phase="idle";render();};
  rec.onend=()=>{if(S.phase==="listening"){S.phase="idle";render();}};
}

// ── Speak with warm voice ──
function speak(text){
  if(!speechSynthesis)return;speechSynthesis.cancel();
  const clean=text.replace(/[\*\#\[\]\(\)]/g,"").replace(/https?:\/\/\S+/g,"").replace(/\n+/g,". ").substring(0,600);
  const u=new SpeechSynthesisUtterance(clean);
  const v=getV();if(v)u.voice=v;
  u.rate=0.88;u.pitch=1.05;u.volume=1.0;
  u.onend=()=>{S.phase="idle";render();};
  S.phase="speaking";render();
  speechSynthesis.speak(u);
}

// ══ FIRE — both systems simultaneously ══
function fire(question){
  S.messages.push({role:"user",text:question});
  render();

  // 1) Send to Veracore iframe via postMessage — runs the REAL pipeline visually
  const frame=document.getElementById("vc-frame");
  if(frame&&frame.contentWindow){
    frame.contentWindow.postMessage({type:"veracore_ask",question:question},"*");
  }

  // 2) API call so Cora gets the answer to speak
  fetch(VC+"/ask",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({question:question})
  })
  .then(r=>r.json())
  .then(data=>{
    const answer=data.answer||"Verification completed.";
    S.messages.push({role:"cora",text:answer});
    S.phase="done";render();scrollT();
    speak(answer);
  })
  .catch(()=>{
    S.messages.push({role:"cora",text:"I'm having trouble reaching Veracore right now."});
    S.phase="idle";render();
  });
}

// ── Actions ──
function toggleListen(){
  if(!rec){S.error="Voice not supported — use Chrome or Edge.";render();return;}
  if(S.phase==="listening"){rec.stop();S.phase="idle";render();return;}
  if(S.phase==="speaking")speechSynthesis.cancel();
  S.phase="listening";S.question="";S.interim="";S.error=null;
  render();rec.start();
}
function resetAll(){
  if(rec&&S.phase==="listening")rec.stop();
  if(speechSynthesis)speechSynthesis.cancel();
  S.phase="idle";S.question="";S.interim="";S.messages=[];S.error=null;
  render();
  const f=document.getElementById("vc-frame");if(f)f.src=VC_EMBED;
}
function onVC(idx){
  S.selectedVoice=idx===""?null:parseInt(idx);render();
  const v=getV();if(v){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance("Hi, I'm Cora.");u.voice=v;u.rate=0.88;u.pitch=1.05;speechSynthesis.speak(u);}
}
function scrollT(){setTimeout(()=>{const el=document.getElementById("tr");if(el)el.scrollTop=el.scrollHeight;},50);}

// ── Health check ──
async function checkH(){try{const r=await fetch(VC+"/api/status",{signal:AbortSignal.timeout(4000)});S.online=r.ok;}catch{S.online=false;}render();}

// ── Render ──
function render(){
  const btnL=S.phase==="listening"?"Listening... tap to stop"
    :S.phase==="processing"?"Verifying..."
    :S.phase==="speaking"?"Cora is speaking..."
    :"Tap to Activate Cora";
  const btnC=S.phase==="listening"?"listening":S.phase==="processing"?"processing":S.phase==="speaking"?"speaking":"";
  const engV=voices.map((v,i)=>({v,i})).filter(({v})=>v.lang.startsWith("en"));
  const curV=getV();

  document.getElementById("app").innerHTML=`
  <!-- HEADER -->
  <div class="header">
    <div class="header-l">
      <div class="gng-logo">G</div>
      <div class="header-brand">
        <div class="header-org">The Good Neighbor Guard</div>
        <div class="header-title"><span class="vc">Veracore</span><span class="sep">+</span><span class="co">Cora</span></div>
      </div>
    </div>
    <div class="header-r">
      <div class="hdr-dot ${S.online?'':'off'}"></div>
      <div class="hdr-label">${S.online?'VERACORE ONLINE':'OFFLINE'}</div>
      <button class="btn-reset" onclick="resetAll()">Reset</button>
    </div>
  </div>

  <!-- SPLIT -->
  <div class="split">
    <!-- LEFT: Actual Veracore UI -->
    <div class="panel-vc">
      <iframe id="vc-frame" class="vc-frame" src="${VC_EMBED}" loading="eager"></iframe>
    </div>

    <!-- RIGHT: Cora -->
    <div class="panel-cora">
      <div class="cora-header">
        <div class="cora-name">Cora</div>
        <div class="cora-tag">Voice Interface</div>
      </div>

      <button class="cora-btn ${btnC}" onclick="toggleListen()" ${S.phase==='processing'?'disabled':''}>${btnL}</button>

      <div class="vrow">
        <label>Voice</label>
        <select onchange="onVC(this.value)">
          ${engV.length===0?'<option>Loading voices...</option>':''}
          ${engV.map(({v,i})=>`<option value="${i}" ${v===curV?'selected':''}>${v.name}</option>`).join('')}
        </select>
      </div>

      <div class="transcript" id="tr">
        ${S.messages.length===0&&S.phase==="idle"?`
          <div class="tr-empty">
            Tap the button and ask a question.<br/><br/>
            Cora listens. Veracore verifies.<br/>
            Both fire at the same time.
          </div>
        `:''}
        ${S.phase==="listening"&&S.messages.length===0?`
          <div class="tr-empty" style="color:var(--green)">
            ${S.interim?`<em style="color:var(--teal)">"${S.interim}"</em><br/><br/>`:''}
            Listening...
          </div>
        `:''}
        ${S.messages.map(m=>`
          <div class="bub ${m.role}">
            <span class="who">${m.role==='user'?'You':'Cora'}</span>
            ${m.text}
          </div>
        `).join('')}
        ${S.phase==="processing"?`
          <div class="bub cora" style="opacity:.5">
            <span class="who">Cora</span>
            Let me check that for you...
          </div>
        `:''}
        ${S.phase==="listening"&&S.messages.length>0?`
          <div class="bub wait">${S.interim||'Listening...'}</div>
        `:''}
      </div>

      ${S.error?`<div style="margin-top:6px;padding:6px 10px;border-radius:6px;background:rgba(239,68,68,.04);border:1px solid rgba(239,68,68,.1);color:var(--red);font-size:10px">${S.error}</div>`:''}

      <div class="cora-foot">
        ${curV?curV.name:'No voice loaded'} · Truth · Safety · We Got Your Back
      </div>
    </div>
  </div>`;
  scrollT();
}

// Init
checkH();setInterval(checkH,30000);render();
</script>
</body>
</html>
