<!DOCTYPE html>
<!--
  VERACORE + CORA — Live Presentation Demo
  The Good Neighbor Guard © 2026 Christopher Hughes | Sacramento CA
  Built with AI collaborators: Claude · GPT · Grok · Gemini
  Truth · Safety · We Got Your Back

  One URL. One button. Both systems live.
  Left: Veracore (actual live UI via iframe). Right: Cora voice interface.
-->
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Veracore + Cora — Live Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #080b12;
  --surface: rgba(14,19,30,.95);
  --border: rgba(255,255,255,.08);
  --text: #e8f0ff;
  --muted: #7a88a8;
  --muted2: #3e4a64;
  --gold: #d4a843;
  --teal: #2dd4bf;
  --green: #4ade80;
  --amber: #f59e0b;
  --red: #ef4444;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Inter', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  overflow: hidden;
}

/* ── HEADER ── */
.demo-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 24px;
  border-bottom: 1px solid var(--border);
  background: rgba(14,19,30,.98);
  height: 48px;
  flex-shrink: 0;
}
.demo-brand {
  display: flex;
  align-items: center;
  gap: 10px;
}
.demo-logo {
  width: 28px; height: 28px;
  border-radius: 7px;
  background: var(--gold);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 900;
  color: var(--bg);
  font-size: 14px;
}
.demo-title { font-size: 14px; font-weight: 700; }
.demo-title span { color: var(--gold); }
.demo-subtitle {
  font-size: 10px; color: var(--muted2);
  letter-spacing: .08em; text-transform: uppercase;
}
.demo-status {
  display: flex; align-items: center; gap: 14px;
}
.status-dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--green);
  box-shadow: 0 0 6px rgba(74,222,128,.3);
}
.status-dot.offline { background: var(--red); box-shadow: 0 0 6px rgba(239,68,68,.3); }
.status-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px; color: var(--muted); letter-spacing: .06em;
}
.btn-reset {
  border: 1px solid var(--border);
  background: rgba(255,255,255,.04);
  color: var(--muted); border-radius: 6px;
  padding: 5px 12px; font-size: 10px; font-weight: 600;
  cursor: pointer; font-family: 'Inter', sans-serif;
  transition: all .15s;
}
.btn-reset:hover { background: rgba(255,255,255,.08); color: var(--text); }

/* ── SPLIT LAYOUT ── */
.split {
  display: grid;
  grid-template-columns: 1fr 1fr;
  height: calc(100vh - 48px);
}

/* LEFT: Veracore iframe */
.panel-left {
  border-right: 1px solid var(--border);
  position: relative;
  overflow: hidden;
}
.panel-left-label {
  position: absolute; top: 0; left: 0; right: 0;
  z-index: 10;
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 14px;
  background: linear-gradient(180deg, rgba(8,11,18,.95) 0%, rgba(8,11,18,.7) 80%, transparent 100%);
  pointer-events: none;
}
.panel-left-name {
  font-size: 13px; font-weight: 800; color: var(--teal); letter-spacing: .02em;
}
.panel-left-tag {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px; color: var(--muted2);
  letter-spacing: .1em; text-transform: uppercase;
}
.veracore-frame {
  width: 100%; height: 100%; border: none;
  background: var(--bg);
}

/* RIGHT: Cora */
.panel-right {
  display: flex; flex-direction: column;
  padding: 20px 24px 20px;
  overflow: hidden;
}
.panel-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 16px; flex-shrink: 0;
}
.panel-name {
  font-size: 18px; font-weight: 800; color: var(--gold);
}
.panel-tag {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px; color: var(--muted2);
  letter-spacing: .1em; text-transform: uppercase;
  padding: 3px 9px; border: 1px solid var(--border); border-radius: 999px;
}

/* ── VOICE BUTTON ── */
.cora-btn {
  width: 100%; padding: 16px; border-radius: 12px;
  border: 2px solid rgba(212,168,67,.15);
  background: rgba(212,168,67,.04);
  color: var(--gold); font-size: 15px; font-weight: 700;
  cursor: pointer; transition: all .25s;
  margin-bottom: 16px; flex-shrink: 0;
  font-family: 'Inter', sans-serif;
}
.cora-btn:hover { background: rgba(212,168,67,.08); border-color: rgba(212,168,67,.3); }
.cora-btn.listening {
  border-color: rgba(74,222,128,.3);
  background: rgba(74,222,128,.04);
  color: var(--green);
}
.cora-btn.speaking {
  border-color: rgba(45,212,191,.3);
  background: rgba(45,212,191,.04);
  color: var(--teal);
}
.cora-btn.processing {
  border-color: rgba(96,165,250,.2);
  background: rgba(96,165,250,.03);
  color: #60a5fa;
}
.cora-btn:disabled { opacity: .4; cursor: not-allowed; }

/* Voice selector */
.voice-row {
  display: flex; align-items: center; gap: 8px;
  margin-bottom: 14px; flex-shrink: 0;
}
.voice-row label {
  font-size: 10px; color: var(--muted2);
  font-family: 'JetBrains Mono', monospace;
  letter-spacing: .06em; text-transform: uppercase;
  white-space: nowrap;
}
.voice-row select {
  flex: 1; padding: 5px 8px; border-radius: 6px;
  background: rgba(255,255,255,.04); border: 1px solid var(--border);
  color: var(--text); font-size: 11px;
  font-family: 'Inter', sans-serif;
  outline: none;
}
.voice-row select:focus { border-color: rgba(212,168,67,.3); }

/* ── TRANSCRIPT ── */
.transcript {
  flex: 1; overflow-y: auto;
  display: flex; flex-direction: column; gap: 10px;
  padding-right: 4px;
}
.transcript::-webkit-scrollbar { width: 4px; }
.transcript::-webkit-scrollbar-thumb { background: rgba(255,255,255,.08); border-radius: 2px; }

.transcript-empty {
  flex: 1; display: flex; align-items: center; justify-content: center;
  text-align: center; color: var(--muted2); font-size: 13px; line-height: 1.9;
  padding: 0 20px;
}

.bubble {
  padding: 14px 16px; border-radius: 12px;
  font-size: 14px; line-height: 1.7;
  animation: fadeIn .3s ease; max-width: 95%;
}
.bubble .who {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px; letter-spacing: .1em; text-transform: uppercase;
  margin-bottom: 5px; display: block;
}
.bubble.user {
  background: rgba(212,168,67,.05);
  border: 1px solid rgba(212,168,67,.1);
  align-self: flex-end;
}
.bubble.user .who { color: var(--gold); }
.bubble.cora {
  background: rgba(45,212,191,.03);
  border: 1px solid rgba(45,212,191,.08);
}
.bubble.cora .who { color: var(--teal); }
.bubble.interim {
  background: transparent;
  border: 1px dashed rgba(212,168,67,.15);
  color: var(--muted); font-style: italic;
}

.cora-status {
  flex-shrink: 0; margin-top: 10px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px; color: var(--muted2); text-align: center;
  letter-spacing: .06em;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(4px); }
  to { opacity: 1; transform: translateY(0); }
}
</style>
</head>
<body>
<div id="app"></div>
<script>
// ══════════════════════════════════════════════════════════════════
// VERACORE + CORA — Live Demo
// Left: actual Veracore at veracore.onrender.com (iframe)
// Right: Cora voice with warm female voice
// ══════════════════════════════════════════════════════════════════

const VERACORE_URL = "https://veracore.onrender.com";

// ── State ──
const S = {
  phase: "idle",       // idle | listening | processing | speaking
  question: "",
  interim: "",
  messages: [],        // {role, text}
  error: null,
  online: true,
  selectedVoice: null, // user-chosen voice index
};

// ── Voice Setup ──
// Priority list: prefer warm female voices, sorted by quality
const VOICE_PRIORITY = [
  // Windows neural voices (best quality on Windows)
  "Microsoft Aria",
  "Microsoft Jenny",
  "Microsoft Sonia",
  "Microsoft Libby",
  "Microsoft Sara",
  "Microsoft Zira",
  // macOS voices
  "Samantha",
  "Karen",
  "Moira",
  "Tessa",
  // Chrome/Android voices
  "Google US English",
  "Google UK English Female",
  "English United States",
  "English United Kingdom",
];

let allVoices = [];
let bestVoice = null;

function loadVoices() {
  allVoices = speechSynthesis.getVoices();
  if (!allVoices.length) return;

  // Find best voice from priority list
  for (const pref of VOICE_PRIORITY) {
    const found = allVoices.find(v => v.name.includes(pref));
    if (found) { bestVoice = found; break; }
  }
  // Fallback: any English female-sounding voice
  if (!bestVoice) {
    bestVoice = allVoices.find(v =>
      v.lang.startsWith("en") && (
        /female|woman|zira|samantha|karen|jenny|aria|sonia|libby|sara|tessa|fiona|alice|victoria|susan/i.test(v.name)
      )
    );
  }
  // Last fallback: any English voice
  if (!bestVoice) {
    bestVoice = allVoices.find(v => v.lang.startsWith("en")) || allVoices[0];
  }

  render();
}

if (window.speechSynthesis) {
  speechSynthesis.onvoiceschanged = loadVoices;
  loadVoices();
}

function getSelectedVoice() {
  if (S.selectedVoice !== null && allVoices[S.selectedVoice]) {
    return allVoices[S.selectedVoice];
  }
  return bestVoice;
}

// ── Speech Recognition ──
const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null;

if (SpeechRec) {
  rec = new SpeechRec();
  rec.lang = "en-US";
  rec.interimResults = true;
  rec.continuous = false;

  rec.onresult = (ev) => {
    let interim = "", final = "";
    for (let i = ev.resultIndex; i < ev.results.length; i++) {
      const t = ev.results[i][0].transcript;
      if (ev.results[i].isFinal) final += t;
      else interim += t;
    }
    if (final) {
      S.question = final.trim();
      S.interim = "";
      S.phase = "processing";
      render();
      submitToVeracore(S.question);
    } else {
      S.interim = interim;
      render();
    }
  };

  rec.onerror = (ev) => {
    if (ev.error !== "no-speech") S.error = "Mic error: " + ev.error;
    S.phase = "idle";
    render();
  };

  rec.onend = () => {
    if (S.phase === "listening") { S.phase = "idle"; render(); }
  };
}

// ── Speak with warm voice ──
function speak(text, onDone) {
  if (!speechSynthesis) { if (onDone) onDone(); return; }
  speechSynthesis.cancel();

  // Clean text for speech
  const clean = text
    .replace(/[\*\#\[\]\(\)]/g, "")
    .replace(/https?:\/\/\S+/g, "")
    .replace(/\n+/g, ". ")
    .substring(0, 600);

  const utt = new SpeechSynthesisUtterance(clean);
  const voice = getSelectedVoice();
  if (voice) utt.voice = voice;

  // Warm, caring tuning — slower, slightly lower pitch
  utt.rate = 0.88;
  utt.pitch = 1.05;
  utt.volume = 1.0;

  utt.onend = () => {
    S.phase = "idle";
    render();
    if (onDone) onDone();
  };

  S.phase = "speaking";
  render();
  speechSynthesis.speak(utt);
}

// ── Submit question to Veracore ──
async function submitToVeracore(question) {
  S.messages.push({ role: "user", text: question });
  render();

  // Also type the question into the Veracore iframe
  injectQuestion(question);

  try {
    const resp = await fetch(VERACORE_URL + "/ask", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question }),
    });
    const data = await resp.json();
    const answer = data.answer || "I verified this but couldn't find a clear answer. Let me look into it more.";

    S.messages.push({ role: "cora", text: answer });
    render();
    scrollTranscript();

    // Speak the answer in Cora's voice
    speak(answer);

  } catch (e) {
    S.error = "Couldn't reach Veracore right now.";
    S.phase = "idle";
    S.messages.push({ role: "cora", text: "I'm having trouble connecting to Veracore. Let me try again in a moment." });
    render();
  }
}

// ── Inject question into Veracore iframe ──
function injectQuestion(question) {
  try {
    const frame = document.getElementById("vc-frame");
    if (!frame || !frame.contentWindow) return;
    // Try to find the textarea in the Veracore iframe and type the question
    const doc = frame.contentDocument || frame.contentWindow.document;
    if (!doc) return;
    const textarea = doc.querySelector("textarea");
    if (textarea) {
      // Set value and trigger input event
      const nativeSetter = Object.getOwnPropertyDescriptor(HTMLTextAreaElement.prototype, 'value').set;
      nativeSetter.call(textarea, question);
      textarea.dispatchEvent(new Event('input', { bubbles: true }));
      // Find and click the submit button
      setTimeout(() => {
        const btn = doc.querySelector(".submit-btn, button[type='submit'], .ask-btn");
        if (btn) btn.click();
        // Also try pressing Enter
        textarea.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', bubbles: true }));
      }, 200);
    }
  } catch (e) {
    // Cross-origin will block this — that's ok, API call still works
  }
}

// ── Actions ──
function toggleListen() {
  if (!rec) { S.error = "Voice not supported. Use Chrome or Edge."; render(); return; }
  if (S.phase === "listening") { rec.stop(); S.phase = "idle"; render(); return; }
  if (S.phase === "speaking") { speechSynthesis.cancel(); }

  S.phase = "listening";
  S.question = "";
  S.interim = "";
  S.error = null;
  render();
  rec.start();
}

function resetAll() {
  if (rec && S.phase === "listening") rec.stop();
  if (speechSynthesis) speechSynthesis.cancel();
  S.phase = "idle";
  S.question = "";
  S.interim = "";
  S.messages = [];
  S.error = null;
  render();
  // Reload Veracore iframe
  const f = document.getElementById("vc-frame");
  if (f) f.src = VERACORE_URL;
}

function onVoiceChange(idx) {
  S.selectedVoice = idx === "" ? null : parseInt(idx);
  render();
  // Preview
  const v = getSelectedVoice();
  if (v) {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance("Hi, I'm Cora.");
    u.voice = v;
    u.rate = 0.88;
    u.pitch = 1.05;
    speechSynthesis.speak(u);
  }
}

function scrollTranscript() {
  setTimeout(() => {
    const el = document.getElementById("transcript");
    if (el) el.scrollTop = el.scrollHeight;
  }, 50);
}

// ── Health ──
async function checkHealth() {
  try {
    const r = await fetch(VERACORE_URL + "/api/status", { signal: AbortSignal.timeout(4000) });
    S.online = r.ok;
  } catch { S.online = false; }
  render();
}

// ── Render ──
function render() {
  const btnLabel = S.phase === "listening" ? "Listening... tap to stop"
    : S.phase === "processing" ? "Verifying with Veracore..."
    : S.phase === "speaking" ? "Cora is speaking..."
    : "Tap to Activate Cora";
  const btnClass = S.phase === "listening" ? "listening"
    : S.phase === "processing" ? "processing"
    : S.phase === "speaking" ? "speaking" : "";
  const btnDisabled = S.phase === "processing";

  // Voice select options
  const englishVoices = allVoices
    .map((v, i) => ({ v, i }))
    .filter(({ v }) => v.lang.startsWith("en"));
  const currentVoice = getSelectedVoice();

  document.getElementById("app").innerHTML = `
    <!-- HEADER -->
    <div class="demo-header">
      <div class="demo-brand">
        <div class="demo-logo">V</div>
        <div>
          <div class="demo-title"><span>Veracore</span> + <span>Cora</span></div>
          <div class="demo-subtitle">Live Demonstration</div>
        </div>
      </div>
      <div class="demo-status">
        <div class="status-dot ${S.online ? '' : 'offline'}"></div>
        <div class="status-label">${S.online ? 'ONLINE' : 'OFFLINE'}</div>
        <button class="btn-reset" onclick="resetAll()">Reset</button>
      </div>
    </div>

    <!-- SPLIT -->
    <div class="split">

      <!-- LEFT: Actual Veracore -->
      <div class="panel-left">
        <div class="panel-left-label">
          <span class="panel-left-name">Veracore</span>
          <span class="panel-left-tag">Live Truth Verification</span>
        </div>
        <iframe id="vc-frame" class="veracore-frame" src="${VERACORE_URL}" allow="clipboard-read; clipboard-write"></iframe>
      </div>

      <!-- RIGHT: Cora -->
      <div class="panel-right">
        <div class="panel-header">
          <div class="panel-name">Cora</div>
          <div class="panel-tag">Voice Interface</div>
        </div>

        <button class="cora-btn ${btnClass}" onclick="toggleListen()" ${btnDisabled ? 'disabled' : ''}>
          ${btnLabel}
        </button>

        <div class="voice-row">
          <label>Voice</label>
          <select onchange="onVoiceChange(this.value)">
            ${englishVoices.length === 0 ? '<option>Loading voices...</option>' : ''}
            ${englishVoices.map(({ v, i }) =>
              `<option value="${i}" ${v === currentVoice ? 'selected' : ''}>${v.name}</option>`
            ).join('')}
          </select>
        </div>

        <div class="transcript" id="transcript">
          ${S.messages.length === 0 && S.phase === "idle" ? `
            <div class="transcript-empty">
              Tap the button above and ask a question.<br/><br/>
              Cora listens, Veracore verifies, and you hear the truth — all in real time.
            </div>
          ` : ''}

          ${S.phase === "listening" && S.messages.length === 0 ? `
            <div class="transcript-empty" style="color:var(--green)">
              Listening...<br/>
              ${S.interim ? `<em style="color:var(--gold)">"${S.interim}"</em>` : 'Speak clearly.'}
            </div>
          ` : ''}

          ${S.messages.map(m => `
            <div class="bubble ${m.role}">
              <span class="who">${m.role === 'user' ? 'You' : 'Cora'}</span>
              ${m.text}
            </div>
          `).join('')}

          ${S.phase === "processing" ? `
            <div class="bubble cora" style="opacity:.5">
              <span class="who">Cora</span>
              Let me check that for you...
            </div>
          ` : ''}

          ${S.phase === "listening" && S.messages.length > 0 ? `
            <div class="bubble interim">
              ${S.interim || 'Listening...'}
            </div>
          ` : ''}
        </div>

        ${S.error ? `
          <div style="margin-top:8px;padding:8px 12px;border-radius:8px;background:rgba(239,68,68,.05);border:1px solid rgba(239,68,68,.12);color:var(--red);font-size:11px;">
            ${S.error}
          </div>
        ` : ''}

        <div class="cora-status">
          ${currentVoice ? currentVoice.name : 'No voice loaded'}
        </div>
      </div>
    </div>
  `;

  scrollTranscript();
}

// ── Init ──
checkHealth();
setInterval(checkHealth, 30000);
render();
</script>
</body>
</html>
