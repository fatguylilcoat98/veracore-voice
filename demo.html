<!DOCTYPE html>
<!--
  VERACORE + CORA — Live Presentation Demo
  The Good Neighbor Guard © 2026 Christopher Hughes | Sacramento CA
  Truth · Safety · We Got Your Back

  Left: The actual Veracore UI (iframe + postMessage bridge).
  Right: Cora voice interface (warm female voice).
  One button. Both fire together.
-->
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Veracore + Cora — Live Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#080b12;--border:rgba(255,255,255,.08);--text:#e8f0ff;--muted:#7a88a8;--dim:#3e4a64;--gold:#d4a843;--teal:#2dd4bf;--green:#4ade80;--amber:#f59e0b;--red:#ef4444;--blue:#60a5fa;--mono:'JetBrains Mono',monospace;--sans:'Inter',system-ui,sans-serif}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:var(--bg);color:var(--text);height:100vh;overflow:hidden}

/* Header */
.hdr{display:flex;align-items:center;justify-content:space-between;padding:8px 20px;border-bottom:1px solid var(--border);background:rgba(14,19,30,.98);height:42px;flex-shrink:0}
.hdr-brand{display:flex;align-items:center;gap:8px}
.hdr-logo{width:24px;height:24px;border-radius:6px;background:var(--gold);display:flex;align-items:center;justify-content:center;font-weight:900;color:var(--bg);font-size:12px}
.hdr-t{font-size:13px;font-weight:700}.hdr-t span{color:var(--gold)}
.hdr-s{font-size:9px;color:var(--dim);letter-spacing:.08em;text-transform:uppercase}
.hdr-r{display:flex;align-items:center;gap:12px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 5px rgba(74,222,128,.3)}.dot.off{background:var(--red)}
.hdr-st{font-family:var(--mono);font-size:9px;color:var(--muted);letter-spacing:.06em}
.btn-sm{border:1px solid var(--border);background:rgba(255,255,255,.04);color:var(--muted);border-radius:5px;padding:4px 10px;font-size:9px;font-weight:600;cursor:pointer;font-family:var(--sans)}
.btn-sm:hover{background:rgba(255,255,255,.08);color:var(--text)}

/* Split — Veracore gets 60%, Cora gets 40% */
.split{display:grid;grid-template-columns:3fr 2fr;height:calc(100vh - 42px)}
.pL{position:relative;border-right:1px solid var(--border);overflow:hidden}
.pR{display:flex;flex-direction:column;padding:16px 20px;overflow:hidden}

/* Veracore iframe fills its panel completely */
.vc-frame{width:100%;height:100%;border:none;background:var(--bg)}

/* Veracore label overlay */
.vc-label{position:absolute;top:0;left:0;z-index:10;display:flex;align-items:center;gap:8px;padding:6px 12px;background:rgba(8,11,18,.85);border-bottom-right-radius:8px;pointer-events:none}
.vc-label-name{font-size:11px;font-weight:800;color:var(--teal)}
.vc-label-tag{font-family:var(--mono);font-size:8px;color:var(--dim);letter-spacing:.1em;text-transform:uppercase}

/* Cora panel */
.ph{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-shrink:0}
.ph-name{font-size:16px;font-weight:800;color:var(--gold)}
.ph-tag{font-family:var(--mono);font-size:8px;color:var(--dim);letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border:1px solid var(--border);border-radius:999px}

.cora-btn{width:100%;padding:14px;border-radius:10px;border:2px solid rgba(212,168,67,.15);background:rgba(212,168,67,.04);color:var(--gold);font-size:14px;font-weight:700;cursor:pointer;transition:all .25s;margin-bottom:12px;flex-shrink:0;font-family:var(--sans)}
.cora-btn:hover{background:rgba(212,168,67,.08);border-color:rgba(212,168,67,.3)}
.cora-btn.listening{border-color:rgba(74,222,128,.3);background:rgba(74,222,128,.04);color:var(--green)}
.cora-btn.speaking{border-color:rgba(45,212,191,.3);background:rgba(45,212,191,.04);color:var(--teal)}
.cora-btn.processing{border-color:rgba(96,165,250,.2);background:rgba(96,165,250,.03);color:var(--blue)}
.cora-btn:disabled{opacity:.4;cursor:not-allowed}

.vrow{display:flex;align-items:center;gap:6px;margin-bottom:10px;flex-shrink:0}
.vrow label{font-size:9px;color:var(--dim);font-family:var(--mono);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.vrow select{flex:1;padding:4px 6px;border-radius:5px;background:rgba(255,255,255,.04);border:1px solid var(--border);color:var(--text);font-size:10px;font-family:var(--sans);outline:none}

.tr{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding-right:3px}
.tr::-webkit-scrollbar{width:3px}.tr::-webkit-scrollbar-thumb{background:rgba(255,255,255,.06);border-radius:2px}
.tr-empty{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--dim);font-size:12px;line-height:1.9;padding:0 12px}

.bub{padding:12px 14px;border-radius:10px;font-size:13px;line-height:1.7;animation:fadeIn .3s ease;max-width:95%}
.bub .who{font-family:var(--mono);font-size:8px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px;display:block}
.bub.user{background:rgba(212,168,67,.05);border:1px solid rgba(212,168,67,.1);align-self:flex-end}.bub.user .who{color:var(--gold)}
.bub.cora{background:rgba(45,212,191,.03);border:1px solid rgba(45,212,191,.08)}.bub.cora .who{color:var(--teal)}
.bub.wait{background:transparent;border:1px dashed rgba(212,168,67,.12);color:var(--muted);font-style:italic}
.cfoot{flex-shrink:0;margin-top:6px;font-family:var(--mono);font-size:9px;color:var(--dim);text-align:center}

@keyframes fadeIn{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:900px){.split{grid-template-columns:1fr}.pL{height:50vh;border-right:none;border-bottom:1px solid var(--border)}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const VC="https://veracore.onrender.com";

const S={phase:"idle",question:"",interim:"",messages:[],error:null,online:true,selectedVoice:null};

// ── Voices ──
const VPRI=["Microsoft Aria","Microsoft Jenny","Microsoft Sonia","Samantha","Karen","Google US English","Google UK English Female"];
let voices=[],bestV=null;
function loadV(){
  voices=speechSynthesis.getVoices();if(!voices.length)return;
  for(const p of VPRI){const f=voices.find(v=>v.name.includes(p));if(f){bestV=f;break;}}
  if(!bestV)bestV=voices.find(v=>v.lang.startsWith("en")&&/female|woman|zira|samantha|karen|jenny|aria|sonia|libby|tessa|fiona|victoria|susan/i.test(v.name));
  if(!bestV)bestV=voices.find(v=>v.lang.startsWith("en"))||voices[0];
  render();
}
if(window.speechSynthesis){speechSynthesis.onvoiceschanged=loadV;loadV();}
function getV(){return S.selectedVoice!==null&&voices[S.selectedVoice]?voices[S.selectedVoice]:bestV;}

// ── Speech Recognition ──
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null;
if(SR){
  rec=new SR();rec.lang="en-US";rec.interimResults=true;rec.continuous=false;
  rec.onresult=(ev)=>{
    let interim="",final="";
    for(let i=ev.resultIndex;i<ev.results.length;i++){
      const t=ev.results[i][0].transcript;
      if(ev.results[i].isFinal)final+=t;else interim+=t;
    }
    if(final){
      S.question=final.trim();S.interim="";S.phase="processing";
      render();
      fireQuestion(S.question);
    }else{S.interim=interim;render();}
  };
  rec.onerror=(ev)=>{if(ev.error!=="no-speech")S.error="Mic error: "+ev.error;S.phase="idle";render();};
  rec.onend=()=>{if(S.phase==="listening"){S.phase="idle";render();}};
}

// ── Speak ──
function speak(text){
  if(!speechSynthesis)return;speechSynthesis.cancel();
  const clean=text.replace(/[\*\#\[\]\(\)]/g,"").replace(/https?:\/\/\S+/g,"").replace(/\n+/g,". ").substring(0,600);
  const u=new SpeechSynthesisUtterance(clean);
  const v=getV();if(v)u.voice=v;
  u.rate=0.88;u.pitch=1.05;u.volume=1.0;
  u.onend=()=>{S.phase="idle";render();};
  S.phase="speaking";render();
  speechSynthesis.speak(u);
}

// ── Fire question into BOTH systems ──
function fireQuestion(question){
  S.messages.push({role:"user",text:question});
  render();

  // 1) Send to Veracore iframe via postMessage — triggers the REAL UI
  const frame=document.getElementById("vc-frame");
  if(frame&&frame.contentWindow){
    frame.contentWindow.postMessage({type:"veracore_ask",question:question},"*");
  }

  // 2) Also call the API so Cora can speak the answer
  fetch(VC+"/ask",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({question:question})
  })
  .then(r=>r.json())
  .then(data=>{
    const answer=data.answer||"Verification completed.";
    S.messages.push({role:"cora",text:answer});
    S.phase="done";
    render();scrollT();
    speak(answer);
  })
  .catch(()=>{
    S.messages.push({role:"cora",text:"I'm having trouble reaching Veracore right now."});
    S.phase="idle";
    render();
  });
}

// ── Actions ──
function toggleListen(){
  if(!rec){S.error="Voice not supported — use Chrome or Edge.";render();return;}
  if(S.phase==="listening"){rec.stop();S.phase="idle";render();return;}
  if(S.phase==="speaking")speechSynthesis.cancel();
  S.phase="listening";S.question="";S.interim="";S.error=null;
  render();rec.start();
}
function resetAll(){
  if(rec&&S.phase==="listening")rec.stop();
  if(speechSynthesis)speechSynthesis.cancel();
  S.phase="idle";S.question="";S.interim="";S.messages=[];S.error=null;
  render();
  // Reload Veracore iframe to reset its UI
  const f=document.getElementById("vc-frame");
  if(f)f.src=VC;
}
function onVC(idx){
  S.selectedVoice=idx===""?null:parseInt(idx);render();
  const v=getV();if(v){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance("Hi, I'm Cora.");u.voice=v;u.rate=0.88;u.pitch=1.05;speechSynthesis.speak(u);}
}
function scrollT(){setTimeout(()=>{const el=document.getElementById("tr");if(el)el.scrollTop=el.scrollHeight;},50);}

// ── Health ──
async function checkH(){try{const r=await fetch(VC+"/api/status",{signal:AbortSignal.timeout(4000)});S.online=r.ok;}catch{S.online=false;}render();}

// ── Render ──
function render(){
  const btnL=S.phase==="listening"?"Listening... tap to stop":S.phase==="processing"?"Verifying...":S.phase==="speaking"?"Cora is speaking...":"Tap to Activate Cora";
  const btnC=S.phase==="listening"?"listening":S.phase==="processing"?"processing":S.phase==="speaking"?"speaking":"";
  const engV=voices.map((v,i)=>({v,i})).filter(({v})=>v.lang.startsWith("en"));
  const curV=getV();

  document.getElementById("app").innerHTML=`
  <div class="hdr">
    <div class="hdr-brand">
      <div class="hdr-logo">V</div>
      <div><div class="hdr-t"><span>Veracore</span> + <span>Cora</span></div><div class="hdr-s">Live Demonstration</div></div>
    </div>
    <div class="hdr-r">
      <div class="dot ${S.online?'':'off'}"></div>
      <div class="hdr-st">${S.online?'ONLINE':'OFFLINE'}</div>
      <button class="btn-sm" onclick="resetAll()">Reset</button>
    </div>
  </div>
  <div class="split">
    <div class="pL">
      <div class="vc-label"><span class="vc-label-name">Veracore</span><span class="vc-label-tag">Live</span></div>
      <iframe id="vc-frame" class="vc-frame" src="${VC}" allow="clipboard-read; clipboard-write"></iframe>
    </div>
    <div class="pR">
      <div class="ph"><div class="ph-name">Cora</div><div class="ph-tag">Voice</div></div>
      <button class="cora-btn ${btnC}" onclick="toggleListen()" ${S.phase==='processing'?'disabled':''}>${btnL}</button>
      <div class="vrow"><label>Voice</label><select onchange="onVC(this.value)">${engV.length===0?'<option>Loading...</option>':''}${engV.map(({v,i})=>`<option value="${i}" ${v===curV?'selected':''}>${v.name}</option>`).join('')}</select></div>
      <div class="tr" id="tr">
        ${S.messages.length===0&&S.phase==="idle"?`<div class="tr-empty">Tap the button and ask a question.<br/><br/>Cora listens. Veracore verifies.<br/>You see the real pipeline working live.</div>`:''}
        ${S.phase==="listening"&&S.messages.length===0?`<div class="tr-empty" style="color:var(--green)">${S.interim?`<em style="color:var(--gold)">"${S.interim}"</em><br/><br/>`:''}Listening...</div>`:''}
        ${S.messages.map(m=>`<div class="bub ${m.role}"><span class="who">${m.role==='user'?'You':'Cora'}</span>${m.text}</div>`).join('')}
        ${S.phase==="processing"?`<div class="bub cora" style="opacity:.5"><span class="who">Cora</span>Let me check that for you...</div>`:''}
        ${S.phase==="listening"&&S.messages.length>0?`<div class="bub wait">${S.interim||'Listening...'}</div>`:''}
      </div>
      ${S.error?`<div style="margin-top:6px;padding:6px 10px;border-radius:6px;background:rgba(239,68,68,.05);border:1px solid rgba(239,68,68,.12);color:var(--red);font-size:10px">${S.error}</div>`:''}
      <div class="cfoot">${curV?curV.name:'No voice loaded'}</div>
    </div>
  </div>`;
  scrollT();
}

checkH();setInterval(checkH,30000);render();
</script>
</body>
</html>
